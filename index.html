<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ブラインドスポーツ EXPO 2026 音声スタンプラリー</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      background-color: #000000;
      color: #ffffff;
      line-height: 1.6;
    }
    h1 {
      font-size: 1.4rem;
      border-bottom: 2px solid #ffffff;
      padding-bottom: 10px;
      color: #ffffff;
    }
    .status-card {
      background: #000000;
      border: 2px solid #ffffff;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 25px;
    }
    .stamp-list {
      list-style: none;
      padding: 0;
    }
    .stamp-item {
      background: #000000;
      margin-bottom: 20px;
      padding: 18px;
      border-radius: 8px;
      border: 2px solid #ffffff;
    }
    .stamp-item.cleared {
      border: 4px solid #ffffff;
      background: #111111;
    }
    .quiz-box {
      font-size: 1.1rem;
      margin: 10px 0;
      font-weight: bold;
      color: #ffffff;
    }
    .answer-box {
      background: #000000;
      padding: 12px;
      border-radius: 6px;
      margin-top: 10px;
      border: 1px solid #ffffff;
      color: #ffffff;
    }
    button {
      background: #ffffff;
      color: #000000;
      border: 2px solid #ffffff;
      font-weight: bold;
      font-size: 1.05rem;
      padding: 14px 20px;
      border-radius: 6px;
      margin-top: 10px;
      cursor: pointer;
      width: 100%;
      min-height: 50px;
    }
    button:focus {
      outline: 4px solid #ffffff;
      outline-offset: 3px;
    }
    .reset-btn {
      background: #000000;
      color: #ffffff;
      border: 1px solid #ffffff;
      margin-top: 40px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>ブラインドスポーツ EXPO 2026<br>音声探偵スタンプラリー</h1>
  </header>

  <main>
    <section class="status-card" aria-live="polite">
      <h2 style="margin-top:0;">スタンプラリー進行状況</h2>
      <p id="progress-text" style="font-size: 1.2rem; font-weight: bold; margin-bottom:0;">獲得数：0 / 10 個</p>
    </section>

    <section>
      <h2>チェックポイント一覧（①〜⑩）</h2>
      <ul class="stamp-list" id="stamp-container"></ul>
    </section>

    <button type="button" class="reset-btn" onclick="resetRally()">スタンプの記録をリセットする</button>
  </main>

  <script>
    const stampData = [
      { id: 1, num: "①", question: "「みつきのクラブだ！って、何？ 確認に行ってみよう！」", answer: "「ここはみつきのアスリートクラブだよ！これからブラインド競技を始めたい方や、ガイドヘルパーさんでブラインド競技のガイドに入りたいとか興味あるとか、そういう方の相談に応じています！」", next: "次は、上へ進んで②のポイントへ向かおう！" },
      { id: 2, num: "②", question: "「音を聞いてナイスショット！この競技はなんだろう？」", answer: "「音を繋ぐ、正解はブラインドテニス！で、日本ブラインドテニス連盟関東地域協会です！」", next: "次は、さらに上へ進んで③のポイントへ向かおう！" },
      { id: 3, num: "③", question: "「気を感じて技を決めよう！この競技はなんだろう？」", answer: "「正解は気配をよみ、技を極める合気道！合気道東京都障がい者合気道同好会です！」", next: "次は、さらに上へ進んで④のポイントへ向かおう！" },
      { id: 4, num: "④", question: "「音のなるボールを打て！この競技は？」", answer: "「守備は素手！サウンドベースボールジャパンです！」", next: "次は、左側の一番上、⑤のポイントへ向かおう！" },
      { id: 5, num: "⑤", question: "「ゴール自体が音を出す！この競技はなんだろう？」", answer: "「ゴールが君を呼んでいる、ブラインドバスケットボールでブランドニューバスケのみなさんです！」", next: "折り返し地点！次は右側の一番上、⑥のポイントへ向かおう！" },
      { id: 6, num: "⑥", question: "「伴走ロープ持った？この競技はなんだろう？」", answer: "「手元をつなぐ50cmの絆！正解は陸上でした！」", next: "次は、下へ進んで⑦のポイントへ向かおう！" },
      { id: 7, num: "⑦", question: "「壁のてっぺんを目指せ！この競技はなんだろう？」", answer: "「命綱は、相棒の声！ここはパラクライミング日本代表濵ノ上選手がいるよ！トークショーも出るよ！」", next: "次は、さらに下へ進んで⑧のポイントへ向かおう！" },
      { id: 8, num: "⑧", question: "「３人で鈴の音をブロック！この競技はなんだろう？」", answer: "「静寂の中、全身が壁になる！正解はゴールボールで、日本ゴールボール協会のみなさんです！」", next: "次は、さらに下へ進んで⑨のポイントへ向かおう！" },
      { id: 9, num: "⑨", question: "「ボールを持ってトライだ！この競技はなんだろう？」", answer: "「音を抱えて突き進め！正解はブラインドラグビーで、日本ブラインドラグビー協会のみなさんです！今年の11月には国際大会が日本で開催されるよ！応援しよう！」", next: "次がいよいよ最後！一番下の⑩のポイントへ向かおう！" },
      { id: 10, num: "⑩", question: "「ネットの下をくぐらせろ！この競技はなんだろう？」", answer: "「隙間4.2cmの限界バトル！正解はサウンド・テーブル・テニスで、東京都サウンドテーブルテニス協会です！」", next: "おめでとうございます！10箇所全スタンプ獲得！受付で景品をもらおう！" }
    ];

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const uttr = new SpeechSynthesisUtterance(text);
        uttr.lang = "ja-JP";
        uttr.rate = 1.0;
        window.speechSynthesis.speak(uttr);
      }
    }

    function getClearedStamps() {
      const saved = localStorage.getItem('expoClearedStamps');
      return saved ? JSON.parse(saved) : [];
    }

    // 問いかけだけを聞く関数（正解は言わない）
    function askQuestion(id) {
      const item = stampData.find(s => s.id === id);
      speak(`${item.num}の問いかけ。${item.question}`);
    }

    // 正解発表＆スタンプ獲得処理
    function checkIn(id) {
      let cleared = getClearedStamps();
      const item = stampData.find(s => s.id === id);

      if (!cleared.includes(id)) {
        cleared.push(id);
        localStorage.setItem('expoClearedStamps', JSON.stringify(cleared));
        const message = `スタンプゲット！${item.num}の正解発表！${item.answer}。${item.next}`;
        speak(message);
      } else {
        const message = `${item.num}はすでに獲得済みです。${item.answer}。${item.next}`;
        speak(message);
      }
      render();
    }

    function render() {
      const cleared = getClearedStamps();
      const container = document.getElementById('stamp-container');
      const progressText = document.getElementById('progress-text');
      
      progressText.textContent = `獲得数：${cleared.length} / 10 個`;
      container.innerHTML = '';

      stampData.forEach(item => {
        const isCleared = cleared.includes(item.id);
        const li = document.createElement('li');
        li.className = `stamp-item ${isCleared ? 'cleared' : ''}`;
        
        // 未獲得時は「問いかけを聞くボタン」だけを表示（正解は絶対に隠す）
        // 獲得済みになって初めて「正解」が表示・再生される
        li.innerHTML = `
          <h3 style="margin-top:0;">${item.num} ${isCleared ? '【スタンプGET！】' : '【未獲得】'}</h3>
          <div class="quiz-box">問いかけ：${item.question}</div>
          ${isCleared ? `<div class="answer-box">正解：${item.answer}</div>` : ''}
          
          ${isCleared ? 
            `<button type="button" onclick="checkIn(${item.id})">正解とガイドをもう一度聞く</button>` : 
            `<button type="button" onclick="askQuestion(${item.id})">問いかけ（ヒント）を聞く</button>`
          }
        `;
        container.appendChild(li);
      });
    }

    function resetRally() {
      if (confirm("スタンプの記録をリセットしますか？")) {
        localStorage.removeItem('expoClearedStamps');
        speak("リセットしました。①番の問いかけからスタートしよう！");
        render();
      }
    }

    // NFCタッチ時（URLの末尾に ?point=1 などがついている場合）の自動チェックイン
    window.addEventListener('DOMContentLoaded', () => {
      render();
      const urlParams = new URLSearchParams(window.location.search);
      const point = parseInt(urlParams.get('point'));
      if (point >= 1 && point <= 10) {
        setTimeout(() => {
          checkIn(point);
        }, 500);
      }
    });
  </script>
</body>
</html>
