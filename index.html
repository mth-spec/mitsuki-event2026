<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ブラインドスポーツ EXPO 2026 音声スタンプラリー</title>
  <style>
    /* 完全な漆黒背景と純白文字のハイコントラストデザイン */
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      background-color: #000000;
      color: #ffffff;
      line-height: 1.6;
    }
    h1 {
      font-size: 1.4rem;
      border-bottom: 2px solid #ffffff;
      padding-bottom: 10px;
      color: #ffffff;
    }
    .status-card {
      background: #000000;
      border: 2px solid #ffffff;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
    }
    /* 全達成時のスペシャルカード */
    .clear-card {
      background: #ffffff;
      color: #000000;
      border: 4px solid #ffffff;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
      text-align: center;
    }
    .clear-card h2 {
      margin-top: 0;
      font-size: 1.5rem;
      color: #000000;
    }
    .clear-card p {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 15px;
    }
    .stamp-list {
      list-style: none;
      padding: 0;
    }
    .stamp-item {
      background: #000000;
      margin-bottom: 20px;
      padding: 18px;
      border-radius: 8px;
      border: 2px solid #ffffff;
    }
    .stamp-item.cleared {
      border: 4px solid #ffffff;
      background: #111111;
    }
    .quiz-box {
      font-size: 1.05rem;
      margin: 10px 0;
      color: #ffffff;
    }
    .answer-box {
      background: #000000;
      padding: 12px;
      border-radius: 6px;
      margin-top: 10px;
      border: 1px solid #ffffff;
      color: #ffffff;
    }
    button {
      background: #ffffff;
      color: #000000;
      border: 2px solid #ffffff;
      font-weight: bold;
      font-size: 1.05rem;
      padding: 14px 20px;
      border-radius: 6px;
      margin-top: 10px;
      cursor: pointer;
      width: 100%;
      min-height: 50px;
    }
    button:focus {
      outline: 4px solid #ffffff;
      outline-offset: 3px;
    }
    /* スタッフ交換用の目立つボタン */
    .exchange-btn {
      background: #000000;
      color: #ffffff;
      border: 3px solid #000000;
      font-size: 1.1rem;
      padding: 16px;
    }
    .reset-btn {
      background: #000000;
      color: #ffffff;
      border: 1px solid #ffffff;
      margin-top: 40px;
      font-size: 0.9rem;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
  </style>
</head>
<body>

  <header role="banner">
    <h1>ブラインドスポーツ EXPO 2026<br>音声探偵スタンプラリー</h1>
  </header>

  <main role="main">
    <!-- 全クリア時にのみ表示されるスペシャル達成領域 -->
    <div id="clear-container"></div>

    <!-- 進行状況アナウンス -->
    <section class="status-card" aria-live="polite" aria-atomic="true">
      <h2 style="margin-top:0;">スタンプラリー進行状況</h2>
      <p id="progress-text" style="font-size: 1.2rem; font-weight: bold; margin-bottom:0;">獲得数：0 / 10 個</p>
    </section>

    <!-- 音声読み上げ用のリアルタイム通知アナウンス領域 -->
    <div id="aria-announce" class="sr-only" aria-live="assertive"></div>

    <!-- チェックポイント一覧（自由な順番で回れる） -->
    <section aria-label="チェックポイント一覧">
      <h2>10箇所のブース一覧（自由な順番で回れます）</h2>
      <ul class="stamp-list" id="stamp-container"></ul>
    </section>

    <button type="button" class="reset-btn" onclick="resetRally()">自分でスタンプの記録を最初からやり直す</button>
  </main>

  <script>
    const stampData = [
      { id: 1, num: "①", question: "みつきのクラブだ！って、何？ 確認に行ってみよう！", answer: "ここはみつきのアスリートクラブだよ！これからブラインド競技を始めたい方や、ガイドヘルパーさんでブラインド競技のガイドに入りたいとか興味あるとか、そういう方の相談に応じています！" },
      { id: 2, num: "②", question: "音を聞いてナイスショット！この競技はなんだろう？", answer: "音を繋ぐ、正解はブラインドテニス！で、日本ブラインドテニス連盟関東地域協会です！" },
      { id: 3, num: "③", question: "気を感じて技を決めよう！この競技はなんだろう？", answer: "正解は気配をよみ、技を極める合気道！合気道東京都障がい者合気道同好会です！" },
      { id: 4, num: "④", question: "音のなるボールを打て！この競技は？", answer: "守備は素手！サウンドベースボールジャパンです！" },
      { id: 5, num: "⑤", question: "ゴール自体が音を出す！この競技はなんだろう？", answer: "ゴールが君を呼んでいる、ブラインドバスケットボールでブランドニューバスケのみなさんです！" },
      { id: 6, num: "⑥", question: "伴走ロープ持った？この競技はなんだろう？", answer: "手元をつなぐ50cmの絆！正解は陸上でした！" },
      { id: 7, num: "⑦", question: "壁のてっぺんを目指せ！この競技はなんだろう？", answer: "命綱は、相棒の声！ここはパラクライミング日本代表濵ノ上選手がいるよ！トークショーも出るよ！" },
      { id: 8, num: "⑧", question: "３人で鈴の音をブロック！この競技はなんだろう？", answer: "静寂の中、全身が壁になる！正解はゴールボールで、日本ゴールボール協会のみなさんです！" },
      { id: 9, num: "⑨", question: "ボールを持ってトライだ！この競技はなんだろう？", answer: "音を抱えて突き進め！正解はブラインドラグビーで、日本ブラインドラグビー協会のみなさんです！今年の11月には国際大会が日本で開催されるよ！応援しよう！" },
      { id: 10, num: "⑩", question: "ネットの下をくぐらせろ！この競技はなんだろう？", answer: "隙間4.2cmの限界バトル！正解はサウンド・テーブル・テニスで、東京都サウンドテーブルテニス協会です！" }
    ];

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const uttr = new SpeechSynthesisUtterance(text);
        uttr.lang = "ja-JP";
        uttr.rate = 1.0;
        window.speechSynthesis.speak(uttr);
      }
      const announcer = document.getElementById('aria-announce');
      if (announcer) {
        announcer.textContent = text;
      }
    }

    function getClearedStamps() {
      const saved = localStorage.getItem('expoClearedStamps');
      return saved ? JSON.parse(saved) : [];
    }

    function askQuestion(id) {
      const item = stampData.find(s => s.id === id);
      speak(`${item.num}のヒント。${item.question}`);
    }

    function checkIn(id) {
      let cleared = getClearedStamps();
      const item = stampData.find(s => s.id === id);

      if (!cleared.includes(id)) {
        cleared.push(id);
        localStorage.setItem('expoClearedStamps', JSON.stringify(cleared));
        
        const total = cleared.length;
        let milestone = "";
        if (total === 10) {
          milestone = "おめでとうございます！10箇所すべてのスタンプが集まりました！受付で景品をもらおう！";
        } else {
          milestone = `現在 ${total} 個目のスタンプを獲得！次は近くの空いているブースを探してみよう！`;
        }

        const message = `スタンプゲット！${item.num}の正解発表！${item.answer}。${milestone}`;
        speak(message);
      } else {
        const message = `${item.num}はすでに獲得済みです。${item.answer}`;
        speak(message);
      }
      render();
    }

    // スタッフが景品を渡した後に押すボタンの処理（自動リセット）
    function exchangePrizeByStaff() {
      if (confirm("【受付スタッフ専用操作】\n景品をお渡ししましたか？\n「OK」を押すと、スタンプの記録がリセットされます。")) {
        localStorage.removeItem('expoClearedStamps');
        speak("景品の受取が完了しました。スタンプの記録をリセットしました。ありがとうございました！");
        render();
      }
    }

    function render() {
      const cleared = getClearedStamps();
      const container = document.getElementById('stamp-container');
      const progressText = document.getElementById('progress-text');
      const clearContainer = document.getElementById('clear-container');
      
      progressText.textContent = `獲得数：${cleared.length} / 10 個`;
      container.innerHTML = '';
      clearContainer.innerHTML = '';

      // 10個すべて集まった場合、目立つクリア画面とスタッフリセットボタンを表示
      if (cleared.length === 10) {
        clearContainer.innerHTML = `
          <div class="clear-card" tabindex="-1" id="clear-card-element">
            <h2>🎉 10個達成！全クリア！</h2>
            <p>おめでとうございます！すべてのスタンプが集まりました。<br>受付でこの画面をお見せください。</p>
            <button type="button" class="exchange-btn" onclick="exchangePrizeByStaff()">
              【スタッフ確認用】<br>景品と交換してスタンプをリセット
            </button>
          </div>
        `;
      }

      stampData.forEach(item => {
        const isCleared = cleared.includes(item.id);
        const li = document.createElement('li');
        li.className = `stamp-item ${isCleared ? 'cleared' : ''}`;
        
        li.innerHTML = `
          <h3 style="margin-top:0; font-size: 1.2rem;">
            ${item.num} ${isCleared ? '【獲得済み】' : '【未獲得】'}
          </h3>
          <div class="quiz-box">問いかけ：${item.question}</div>
          ${isCleared ? `<div class="answer-box"><strong>正解：</strong>${item.answer}</div>` : ''}
          
          ${isCleared ? 
            `<button type="button" aria-label="${item.num} 正解ともう一度ガイドを聞く" onclick="checkIn(${item.id})">正解とガイドをもう一度聞く</button>` : 
            `<button type="button" aria-label="${item.num} 問いかけを聞く" onclick="askQuestion(${item.id})">問いかけ（ヒント）を聞く</button>`
          }
        `;
        container.appendChild(li);
      });
    }

    function resetRally() {
      if (confirm("スタンプの記録をリセットしますか？")) {
        localStorage.removeItem('expoClearedStamps');
        speak("スタンプの記録をリセットしました。好きなブースからスタートしよう！");
        render();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      render();
      const urlParams = new URLSearchParams(window.location.search);
      const point = parseInt(urlParams.get('point'));
      
      if (point >= 1 && point <= 10) {
        checkIn(point);
        
        setTimeout(() => {
          const cleared = getClearedStamps();
          // 10個集まった時は達成カードに、それ以外は該当カードにフォーカス移動
          if (cleared.length === 10) {
            const clearCard = document.getElementById('clear-card-element');
            if (clearCard) clearCard.focus();
          } else {
            const targetCard = document.querySelectorAll('.stamp-item')[point - 1];
            if (targetCard) {
              targetCard.setAttribute('tabindex', '-1');
              targetCard.focus();
            }
          }
        }, 300);
      }
    });
  </script>
</body>
</html>
